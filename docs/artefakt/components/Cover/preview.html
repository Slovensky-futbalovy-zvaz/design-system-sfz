<!--
blocks: brand-blue 352×288 slab bleeding off top/right (x 608), brand-blue-deep 96×288 (space-9 wide) at x 512, brand-red 64×64 (space-8) disc-satellite, brand-blue-tint 160×96 relief block
arrangement: one tall slab with satellites, flush to the right edge; everything right of x=480
pattern: discs and rings from radius-pill (the round SFZ emblem and the ball) – "a literal motif → discs built from radii"; 9 units, cut from the slab in ground/tint
scales: sides space-8 (64), space-9 (96), space-10 (128); ring stroke 8 = space-2; disc r 32/48 = half of space-8/space-9
-->
<style>
*{box-sizing:border-box;margin:0}
body{background:var(--surface);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
.c{position:relative;width:960px;height:288px;overflow:hidden}
svg{position:absolute;inset:0}
.brand{fill:var(--brand-blue)}.deep{fill:var(--brand-blue-deep)}.red{fill:var(--brand-red)}.tint{fill:var(--brand-blue-tint)}.ground{fill:var(--surface)}
.ring{fill:none;stroke:var(--surface);stroke-width:8}
.name{position:absolute;left:48px;bottom:40px;width:440px}
.name h1{font-size:72px;line-height:.95;font-weight:700;letter-spacing:-.03em}
.name p{font-size:14px;line-height:1.3;margin-top:12px;color:var(--ink-muted)}
</style>
<div class="c">
<svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
  <rect class="deep" x="512" y="0" width="96" height="288"/>
  <rect class="brand" x="608" y="0" width="352" height="288"/>
  <rect class="tint" x="512" y="192" width="96" height="96"/>
  <circle class="ground" cx="704" cy="96" r="48"/>
  <circle class="ring" cx="800" cy="96" r="44"/>
  <circle class="ground" cx="896" cy="96" r="32"/>
  <circle class="ring" cx="704" cy="208" r="28"/>
  <circle class="ground" cx="800" cy="208" r="48"/>
  <circle class="ring" cx="896" cy="208" r="44"/>
  <circle class="red" cx="560" cy="96" r="32"/>
  <circle class="ground" cx="560" cy="240" r="16"/>
</svg>
<div class="name"><h1>SFZ Design<br>System</h1><p>Farby a logá z manuálu SFZ, skladba obrazovky podľa Apple HIG.</p></div>
</div>
