<!-- @dsCard group="Spätná väzba" height=160 subtitle="Dočasné správy (region dole)" -->
<style>body{margin:0;padding:16px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:12px;max-width:480px}</style>
<div id="root"></div>
<script>
const h=React.createElement, S=SFZ;
function App(){
const [items,setItems]=React.useState([{id:1,message:"Zmeny boli uložené.",tone:"success"},{id:2,message:"Nepodarilo sa odoslať.",tone:"danger",actionLabel:"Skúsiť znova"}]);
return h("div",null,h(S.Button,{onClick:()=>setItems([...items,{id:Date.now(),message:"Nová správa "+(items.length+1)}])},"Pridať toast"),h(S.Toast,{items,onDismiss:id=>setItems(items.filter(t=>t.id!==id)),position:"top"}));}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
