<!-- @dsCard group="Slajdy" height=240 width=1920 subtitle="Dlaždice s číslami" -->
<style>
*{box-sizing:border-box;margin:0}
body{font-family:var(--font-sans);color:var(--ink);background:var(--surface);-webkit-font-smoothing:antialiased}
.slide{width:1920px;height:1080px;position:relative;overflow:hidden;padding:64px 96px}
.slide.blue{background:var(--surface-brand);color:var(--on-brand)}
.foot{position:absolute;left:96px;right:96px;bottom:48px;display:flex;justify-content:space-between;align-items:center}
.foot img{height:56px}
.eyebrow{text-transform:uppercase;color:var(--brand-blue)}
.blue .eyebrow{color:var(--on-brand-muted)}
.muted{color:var(--ink-muted)}
.blue .muted{color:var(--on-brand-muted)}
.tn{font-variant-numeric:tabular-nums}
</style>
<div style="width:1920px;padding:48px 96px;display:grid;grid-template-columns:repeat(3,1fr);gap:48px">
  <div style="background:var(--surface-raised);border-radius:var(--radius-lg);padding:48px">
    <div class="slide-stat tn" style="color:var(--brand-blue)">47,9 mil. €</div>
    <div class="slide-h2" style="margin-top:16px">pod kontrolou</div>
    <div class="slide-caption muted" style="margin-top:8px">mesačná zberná fakturácia, 2012 – 2022</div>
  </div>
  <div style="background:var(--surface-raised);border-radius:var(--radius-lg);padding:48px">
    <div class="slide-stat tn" style="color:var(--brand-red)">−3 body</div>
    <div class="slide-h2" style="margin-top:16px">za neuhradené faktúry</div>
    <div class="slide-caption muted" style="margin-top:8px">najúčinnejší trest</div>
  </div>
  <div style="background:var(--brand-blue-tint);border-radius:var(--radius-lg);padding:48px">
    <div class="slide-stat tn">197 122</div>
    <div class="slide-h2" style="margin-top:16px">aktívnych osobných kont</div>
    <div class="slide-caption muted" style="margin-top:8px">ISSF, 2022</div>
  </div>
</div>
<script>/* statický vzor */</script>
