# Kontrola každého pull requestu a pushu do main: tokeny, typy, ESLint, testy.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: tokens.css je aktuálny
        run: git diff --exit-code tokens/tokens.css
