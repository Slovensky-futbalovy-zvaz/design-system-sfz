<!doctype html>
<html lang="sk" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Časová os – šablóna slajdu SFZ</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="slide.css">
</head>
<body>
<!-- Max. 6 bodov; pointa slajdu (jeden bod) je červená. -->
<div class="stage">
<section class="slide slide--content">
  <div class="band"><p class="slide-band">Blok 1 · [obdobie]</p></div>
  <h2 class="slide-h1" style="max-width:1600px">[Nadpis časovej osi]</h2>
  <div class="timeline"><ol>
    <li><span class="slide-h2 y tn">2010</span><span class="slide-caption">[udalosť]</span></li>
    <li><span class="slide-h2 y tn">2011</span><span class="slide-caption">[udalosť]</span></li>
    <li class="is-key"><span class="slide-h2 y tn">2012</span><span class="slide-caption">[kľúčová udalosť]</span></li>
    <li><span class="slide-h2 y tn">2014</span><span class="slide-caption">[udalosť]</span></li>
    <li><span class="slide-h2 y tn">2020</span><span class="slide-caption">[udalosť]</span></li>
    <li><span class="slide-h2 y tn">2026</span><span class="slide-caption">[udalosť]</span></li>
  </ol></div>
  <div class="foot"><span class="slide-caption muted">[Názov prezentácie] · 4</span><img src="../../brand/logos/Loga-SFZ/sfz-D-farebne.svg" alt="Slovenský futbalový zväz"></div>
</section>
</div>
<script>
  // Zmenší slajd 1920×1080 tak, aby sa zmestil do okna (mobil aj projektor).
  function fit() { document.documentElement.style.setProperty("--scale", Math.min(innerWidth / 1920, innerHeight / 1080)); }
  addEventListener("resize", fit); fit();
</script>
</body>
</html>
