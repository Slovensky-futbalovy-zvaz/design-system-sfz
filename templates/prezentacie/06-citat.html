<!doctype html>
<html lang="sk" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Citát a karty – šablóna slajdu SFZ</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="slide.css">
</head>
<body>
<!-- Dve karty vedľa seba: tvrdenie s vysvetlením a citát v slovenských úvodzovkách. -->
<div class="stage">
<section class="slide">
  <div style="display:grid;gap:var(--space-5)">
    <p class="slide-eyebrow eyebrow">Blok 2 · [téma]</p>
    <h2 class="slide-h1" style="max-width:1600px">[Nadpis]</h2>
  </div>
  <div class="grid-2">
    <div class="card"><h3 class="slide-h2">[Tvrdenie]</h3><p class="slide-body muted">[Vysvetlenie v jednej až dvoch vetách.]</p></div>
    <div class="card card--highlight" style="justify-content:center"><p class="slide-h2" style="font-weight:500">„[Citát]“</p><p class="slide-caption muted">[autor, rok]</p></div>
  </div>
  <div class="foot"><span class="slide-caption muted">[Názov prezentácie] · 4</span><img src="../../brand/logos/Loga-SFZ/sfz-D-farebne.svg" alt="Slovenský futbalový zväz"></div>
</section>
</div>
<script>
  // Zmenší slajd 1920×1080 tak, aby sa zmestil do okna (mobil aj projektor).
  function fit() { document.documentElement.style.setProperty("--scale", Math.min(innerWidth / 1920, innerHeight / 1080)); }
  addEventListener("resize", fit); fit();
</script>
</body>
</html>
