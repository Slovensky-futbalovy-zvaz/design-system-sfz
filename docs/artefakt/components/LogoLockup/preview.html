<!-- @dsCard group="Logá" height=220 width=1920 subtitle="Logo na svetlom a modrom" -->
<style>
*{box-sizing:border-box;margin:0}
body{font-family:var(--font-sans);color:var(--ink);background:var(--surface);-webkit-font-smoothing:antialiased}
.slide{width:1920px;height:1080px;position:relative;overflow:hidden;padding:64px 96px}
.slide.blue{background:var(--surface-brand);color:var(--on-brand)}
.foot{position:absolute;left:96px;right:96px;bottom:48px;display:flex;justify-content:space-between;align-items:center}
.foot img{height:56px}
.eyebrow{text-transform:uppercase;color:var(--brand-blue)}
.blue .eyebrow{color:var(--on-brand-muted)}
.muted{color:var(--ink-muted)}
.blue .muted{color:var(--on-brand-muted)}
.tn{font-variant-numeric:tabular-nums}
</style>
<div style="width:1920px;display:grid;grid-template-columns:1fr 1fr">
  <div style="padding:48px 96px;display:flex;align-items:center;gap:96px;background:var(--surface)">
    <img src="../../../../brand/logos/Loga-SFZ/sfz-A-farebne.svg" alt="SFZ, variant A" style="height:120px"><img src="../../../../brand/logos/Loga-SFZ/sfz-D-farebne.svg" alt="SFZ, variant D" style="height:72px">
  </div>
  <div style="padding:48px 96px;display:flex;align-items:center;gap:96px;background:var(--surface-brand)">
    <img src="../../../../brand/logos/Loga-SFZ/sfz-A-biele.svg" alt="SFZ, variant A biely" style="height:120px"><img src="../../../../brand/logos/Loga-SFZ/sfz-D-biele.svg" alt="SFZ, variant D biely" style="height:72px">
  </div>
</div>
